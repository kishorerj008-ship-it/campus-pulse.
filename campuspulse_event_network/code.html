xs":"0.25rem","gutter":"1.5rem","space-xl":"2.5rem","space-sm":"0.5rem","margin":"2rem"},fontFamily:{"headline-lg-mobile":["Plus Jakarta Sans"],"display":["Plus Jakarta Sans"],"body-lg":["Inter"],"caption":["Inter"],"headline-sm":["Plus Jakarta Sans"],"body-sm":["Inter"],"headline-lg":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"title-md":["Plus Jakarta Sans"],"body-md":["Inter"]},fontSize:{"headline-lg-mobile":["28px",{lineHeight:"36px",letterSpacing:"-0.015em",fontWeight:"700"}],"display":["48px",{lineHeight:"56px",letterSpacing:"-0.025em",fontWeight:"800"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"caption":["11px",{lineHeight:"14px",letterSpacing:"0.02em",fontWeight:"500"}],"headline-sm":["20px",{lineHeight:"28px",letterSpacing:"-0.01em",fontWeight:"600"}],"body-sm":["13px",{lineHeight:"18px",fontWeight:"400"}],"headline-lg":["36px",{lineHeight:"44px",letterSpacing:"-0.02em",fontWeight:"700"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.01em",fontWeight:"600"}],"label-sm":["12px",{lineHeight:"16px",letterSpacing:"0.02em",fontWeight:"600"}],"headline-md":["24px",{lineHeight:"32px",letterSpacing:"-0.015em",fontWeight:"700"}],"title-md":["16px",{lineHeight:"24px",letterSpacing:"-0.005em",fontWeight:"600"}],"body-md":["15px",{lineHeight:"22px",fontWeight:"400"}]}}}}</script></head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-gutter"><main class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] p-space-xl"><div class="flex flex-col w-full relative">
<!-- Brand Header -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary-fixed text-primary font-label-sm mb-3">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span>Live Campus Network</span>
</div>
<div class="flex items-center gap-2.5 mb-1.5">
<div class="w-10 h-10 rounded-xl bg-primary text-on-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[24px]">hub</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">CampusPulse</h1>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-sm">
      Discover, join, and host university experiences in real time.
    </p>
</div>
<!-- Role Toggle Segmented Control -->
<div class="p-1 rounded-xl bg-surface-container flex items-center mb-space-lg relative" role="tablist">
<button aria-selected="true" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm" id="btn-student" onclick="setRole('student')" role="tab" type="button">
<span class="material-symbols-outlined text-[18px]">school</span>
<span>Student</span>
<span class="px-1.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-caption text-caption" id="student-badge">Active</span>
</button>
<button aria-selected="false" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="btn-organiser" onclick="setRole('organiser')" role="tab" type="button">
<span class="material-symbols-outlined text-[18px]">domain_verification</span>
<span>Organiser</span>
<span class="hidden px-1.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-caption text-caption" id="organiser-badge">Active</span>
</button>
</div>
<!-- Form -->
<form class="flex flex-col gap-4" id="auth-form" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="campus-email">
<span id="label-email">Campus NetID or Student Email</span>
<span class="font-caption text-caption text-outline">.edu domain preferred</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full h-11 pl-10 pr-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline outline-none focus:bg-surface-container-low transition-colors duration-150" id="campus-email" placeholder="netid@stanford.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="campus-password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#forgot">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-11 pl-10 pr-11 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline outline-none focus:bg-surface-container-low transition-colors duration-150" id="campus-password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface flex items-center justify-center p-1 rounded-lg" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me / Device Safety Option -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-primary focus:ring-0 bg-surface-container-low accent-primary cursor-pointer" id="remember-device" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me on this campus device</span>
</label>
<div class="group relative flex items-center cursor-help">
<span class="material-symbols-outlined text-outline text-[16px]">info</span>
<span class="absolute bottom-full right-0 mb-1.5 hidden group-hover:block w-48 p-2 rounded-lg bg-inverse-surface text-inverse-on-surface font-caption text-caption shadow-md z-10">
          Uncheck on public library or cluster terminals for security.
        </span>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-11 mt-2 rounded-xl bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary-container active:scale-[0.99] transition-all duration-150 shadow-md" type="submit">
<span id="cta-label">Sign In as Student</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-3 my-space-lg">
<div class="flex-1 h-px bg-surface-container-high"></div>
<span class="font-caption text-caption text-outline uppercase tracking-wider">Campus SSO Single Sign-On</span>
<div class="flex-1 h-px bg-surface-container-high"></div>
</div>
<!-- SSO Buttons -->
<div class="flex flex-col gap-2.5">
<button class="w-full h-11 px-4 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-3 transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-primary text-[20px]">account_balance</span>
<span>Log in with University SSO / NetID</span>
</button>
<button class="w-full h-11 px-4 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-3 transition-colors duration-150" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
</div>
<!-- Dynamic Footer Registration Prompt -->
<div class="mt-space-lg pt-4 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
<span id="footer-prompt-text">New student on campus?</span>
<a class="font-label-sm text-label-sm text-primary hover:underline ml-1 font-semibold" href="#register" id="footer-prompt-link">
        Create an account
      </a>
</p>
</div>
</div>
<script>
  let currentRole = 'student';

  function setRole(role) {
    currentRole = role;
    const btnStudent = document.getElementById('btn-student');
    const btnOrganiser = document.getElementById('btn-organiser');
    const badgeStudent = document.getElementById('student-badge');
    const badgeOrganiser = document.getElementById('organiser-badge');
    const emailLabel = document.getElementById('label-email');
    const emailInput = document.getElementById('campus-email');
    const ctaLabel = document.getElementById('cta-label');
    const footerPrompt = document.getElementById('footer-prompt-text');
    const footerLink = document.getElementById('footer-prompt-link');

    if (role === 'student') {
      btnStudent.className = "flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm";
      btnStudent.setAttribute('aria-selected', 'true');
      btnOrganiser.className = "flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      btnOrganiser.setAttribute('aria-selected', 'false');

      badgeStudent.classList.remove('hidden');
      badgeOrganiser.classList.add('hidden');

      emailLabel.textContent = "Campus NetID or Student Email";
      emailInput.placeholder = "netid@stanford.edu";
      ctaLabel.textContent = "Sign In as Student";
      footerPrompt.textContent = "New student on campus?";
      footerLink.textContent = "Create an account";
    } else {
      btnOrganiser.className = "flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm";
      btnOrganiser.setAttribute('aria-selected', 'true');
      btnStudent.className = "flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      btnStudent.setAttribute('aria-selected', 'false');

      badgeOrganiser.classList.remove('hidden');
      badgeStudent.classList.add('hidden');

      emailLabel.textContent = "Organiser or Club Official Email";
      emailInput.placeholder = "president@roboticssociety.edu";
      ctaLabel.textContent = "Sign In as Organiser";
      footerPrompt.textContent = "Hosting events for your club?";
      footerLink.textContent = "Register your student organisation";
    }
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('campus-password');
    const icon = document.getElementById('pwd-icon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwd.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
